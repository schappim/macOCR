name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version in the source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source_version="$(sed -n 's/^let ocrVersion = "\(.*\)"$/\1/p' ocr/main.swift)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ocrVersion \"$source_version\" in ocr/main.swift."
            echo "Bump the constant and the tag together, so --version and --update tell the truth."
            exit 1
          fi

      - name: Install CocoaPods
        run: pod install

      - name: Build (${{ matrix.arch }})
        run: |
          xcodebuild -workspace ocr.xcworkspace \
            -scheme ocr \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare artifact
        # Staged in dist/ because the repo already has an ocr/ source directory:
        # copying the binary to ./ocr would land it inside that directory and
        # ship the whole thing, source and all, instead of a bare executable.
        run: |
          mkdir -p dist
          cp build/Build/Products/Release/ocr dist/ocr
          chmod +x dist/ocr
          file dist/ocr
          tar czf macOCR-${{ matrix.arch }}.tar.gz -C dist ocr
          tar tzf macOCR-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOCR-${{ matrix.arch }}
          path: macOCR-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            macOCR-x86_64.tar.gz
            macOCR-arm64.tar.gz
